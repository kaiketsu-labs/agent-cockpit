<svg xmlns="http://www.w3.org/2000/svg" width="480" height="612" viewBox="0 0 480 612" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <clipPath id="frame"><rect width="480" height="612" rx="10"/></clipPath>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272c"/>
      <stop offset="100%" stop-color="#212126"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8825a"/>
      <stop offset="100%" stop-color="#c96442"/>
    </linearGradient>
    <linearGradient id="cacheGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8825a"/>
      <stop offset="100%" stop-color="#f2a97e"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="480" height="612" fill="#18181b"/>

    <!-- Activity Bar -->
    <rect width="48" height="590" fill="#202024"/>
    <rect x="0" y="14" width="2.5" height="30" rx="1" fill="#e8825a"/>
    <!-- Activity bar icon: exact vscode/media/icon.svg -->
    <g transform="translate(12 17)" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8.5" y="2" width="12.5" height="16" rx="2.5" fill="#ffffff" fill-opacity="0.04" opacity="0.28" transform="rotate(15 14.75 10)" />
      <rect x="6" y="3" width="13" height="16.5" rx="2.5" fill="#ffffff" fill-opacity="0.06" opacity="0.55" transform="rotate(7.5 12.5 11.25)" />
      <rect x="3" y="4.5" width="13.5" height="16.5" rx="2.5" fill="#ffffff" fill-opacity="0.1" />
      <g transform="translate(12.8 8.3)" stroke-width="1.2" opacity="0.9">
        <line x1="0" y1="-1.9" x2="0" y2="1.9" />
        <line x1="-1.65" y1="-0.95" x2="1.65" y2="0.95" />
        <line x1="-1.65" y1="0.95" x2="1.65" y2="-0.95" />
      </g>
      <path d="M6.3 11.5l3 2.5-3 2.5" stroke-width="1.65" />
      <line x1="10.8" y1="16.5" x2="13.4" y2="16.5" stroke-width="1.65" />
    </g>
    <g fill="#71717a" opacity=".35">
      <rect x="15" y="68" width="18" height="18" rx="3"/>
      <rect x="15" y="104" width="18" height="18" rx="3"/>
      <rect x="15" y="140" width="18" height="18" rx="3"/>
    </g>

    <!-- Sidebar main area -->
    <rect x="48" width="432" height="590" fill="#1e1e22"/>

    <!-- Sticky Header Bar (.bar in inbox.js) -->
    <rect x="48" y="0" width="432" height="102" fill="#1b1b1f"/>
    <line x1="48" y1="102" x2="480" y2="102" stroke="#2e2e36"/>

    <!-- Row 1: .hero (Brand + Actions: + Session, + Folder, Refresh) -->
    <g transform="translate(58 11)">
      <rect x="0" y="0" width="20" height="20" rx="5" fill="url(#brandGrad)"/>
      <path d="M5.5 6.5l3 2.5-3 2.5M10 11.5h2.8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="27" y="14.5" fill="#f4f4f5" font-size="12.5" font-weight="700">Claude Deck</text>

      <!-- + Session button (centered text) -->
      <rect x="238" y="-1" width="76" height="22" rx="5" fill="url(#brandGrad)"/>
      <text x="276" y="14" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">+ Session</text>

      <!-- + Folder button (centered text) -->
      <rect x="319" y="-1" width="66" height="22" rx="5" fill="#26262c" stroke="#383842"/>
      <text x="352" y="14" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="500">+ Folder</text>

      <!-- Refresh icon button -->
      <rect x="390" y="-1" width="22" height="22" rx="5" fill="#26262c" stroke="#383842"/>
      <path d="M405 8.5A4.2 4.2 0 1 0 404 12.5M405 5.5v3h-3" fill="none" stroke="#a1a1aa" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Row 2: .search-wrap -->
    <g transform="translate(58 40)">
      <rect width="412" height="25" rx="6" fill="#151518" stroke="#2e2e36"/>
      <circle cx="13" cy="12" r="3.8" fill="none" stroke="#71717a" stroke-width="1.3"/>
      <line x1="16" y1="15" x2="19" y2="18" stroke="#71717a" stroke-width="1.3" stroke-linecap="round"/>
      <text x="26" y="16.5" fill="#71717a" font-size="11">Search folders, tickets, sessions, PRs…</text>
    </g>

    <!-- Row 3: .filter-bar (.segmented All | Active | PRs + .stats-pills) -->
    <g transform="translate(58 72)">
      <rect width="132" height="22" rx="5" fill="#151518" stroke="#2c2c34"/>
      <rect x="2" y="2" width="38" height="18" rx="4" fill="#2d2d35"/>
      <text x="21" y="14.5" text-anchor="middle" fill="#f4f4f5" font-size="10.5" font-weight="600">All</text>
      <text x="64" y="14.5" text-anchor="middle" fill="#a1a1aa" font-size="10.5">Active</text>
      <text x="108" y="14.5" text-anchor="middle" fill="#a1a1aa" font-size="10.5">PRs</text>

      <!-- Status summary pills (generous width + centered text) -->
      <rect x="252" y="2" width="76" height="18" rx="9" fill="#cca700" fill-opacity="0.16" stroke="#cca700" stroke-opacity="0.38"/>
      <text x="290" y="14.5" text-anchor="middle" fill="#fde047" font-size="10" font-weight="600">● 1 waiting</text>

      <rect x="334" y="2" width="78" height="18" rx="9" fill="#3794ff" fill-opacity="0.16" stroke="#3794ff" stroke-opacity="0.38"/>
      <text x="373" y="14.5" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">↻ 2 running</text>
    </g>

    <!-- Section 1: ATTENTION NEEDED (.needs-card.blocked in inbox.js) -->
    <g transform="translate(58 112)">
      <text x="4" y="11" fill="#8e8e98" font-size="9.5" font-weight="700" letter-spacing="0.8">ATTENTION NEEDED</text>
      <rect x="122" y="0" width="20" height="14" rx="7" fill="#e8825a" fill-opacity="0.14" stroke="#e8825a" stroke-opacity="0.38"/>
      <text x="132" y="10" text-anchor="middle" fill="#e8825a" font-size="9" font-weight="700">1</text>

      <g transform="translate(0 18)">
        <rect width="412" height="32" rx="6" fill="#29241b" stroke="#cca700" stroke-opacity="0.45"/>
        <path d="M0 6a6 6 0 0 1 3 -5.2v30.4a6 6 0 0 1 -3 -5.2z" fill="#cca700"/>
        <circle cx="15" cy="16" r="4" fill="#cca700">
          <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <!-- PROJ-142 badge (wider + centered text) -->
        <rect x="27" y="7.5" width="64" height="17" rx="8.5" fill="#18181b" stroke="#383842"/>
        <text x="59" y="19" text-anchor="middle" fill="#a1a1aa" font-size="9.5" font-weight="600">PROJ-142</text>
        <text x="99" y="20" fill="#f4f4f5" font-size="11.5" font-weight="600">Review PR feedback</text>
        <!-- Needs input CTA badge (wider + centered text) -->
        <rect x="326" y="7" width="76" height="18" rx="4" fill="#cca700" fill-opacity="0.22"/>
        <text x="364" y="19" text-anchor="middle" fill="#fde047" font-size="10" font-weight="600">needs input</text>
      </g>
    </g>

    <!-- Section 2: Top-level Ticket Card PROJ-142 (.card.busy in inbox.js) -->
    <g transform="translate(58 174)">
      <rect width="412" height="174" rx="9" fill="url(#cardGrad)" stroke="#e8825a" stroke-opacity="0.42"/>

      <!-- Card header (.head) -->
      <path d="M11 14.5l3.5 3.5 3.5-3.5" fill="none" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Bookmark ticket icon (.ico.ticket.t-indeterminate) -->
      <path d="M26 11h8v10l-4-2.5-4 2.5z" fill="none" stroke="#3794ff" stroke-width="1.4" stroke-linejoin="round"/>
      <!-- Ticket pill (.key.ticket-pill.t-indeterminate) -->
      <rect x="40" y="7.5" width="66" height="17" rx="4" fill="#3794ff" fill-opacity="0.14" stroke="#3794ff" stroke-opacity="0.38"/>
      <text x="73" y="19.5" text-anchor="middle" fill="#f4f4f5" font-size="10.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PROJ-142</text>
      <text x="114" y="20" fill="#a1a1aa" font-size="11" font-weight="500">Add PDF export</text>

      <!-- Header count badges (generous width + centered text) -->
      <rect x="226" y="8" width="62" height="16" rx="8" fill="#cca700" fill-opacity="0.14" stroke="#cca700" stroke-opacity="0.45"/>
      <text x="257" y="19" text-anchor="middle" fill="#cca700" font-size="9.5" font-weight="600">1 blocked</text>
      <rect x="292" y="8" width="64" height="16" rx="8" fill="#3794ff" fill-opacity="0.14" stroke="#3794ff" stroke-opacity="0.45"/>
      <text x="324" y="19" text-anchor="middle" fill="#3794ff" font-size="9.5" font-weight="600">1 working</text>
      <rect x="360" y="8" width="42" height="16" rx="8" fill="#89d185" fill-opacity="0.12" stroke="#89d185" stroke-opacity="0.45"/>
      <text x="381" y="19" text-anchor="middle" fill="#89d185" font-size="9.5" font-weight="600">⎇ 1</text>

      <!-- Card body (.body) -->
      <line x1="1" y1="32" x2="411" y2="32" stroke="#2e2e36"/>

      <!-- .sub: PULL REQUESTS -->
      <text x="12" y="46" fill="#71717a" font-size="9" font-weight="700" letter-spacing="0.6">PULL REQUESTS</text>
      <!-- .pr-row -->
      <g transform="translate(8 51)">
        <rect width="396" height="24" rx="6" fill="#89d185" fill-opacity="0.07" stroke="#89d185" stroke-opacity="0.22"/>
        <circle cx="12" cy="8" r="1.5" fill="none" stroke="#89d185" stroke-width="1.3"/>
        <circle cx="12" cy="16" r="1.5" fill="none" stroke="#89d185" stroke-width="1.3"/>
        <line x1="12" y1="9.5" x2="12" y2="14.5" stroke="#89d185" stroke-width="1.3"/>
        <text x="22" y="16" fill="#89d185" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">api#88</text>
        <text x="64" y="16" fill="#e4e4e7" font-size="10.5">feat(PROJ-142): PDF export endpoint</text>
      </g>

      <!-- .sub: SESSIONS -->
      <text x="12" y="90" fill="#71717a" font-size="9" font-weight="700" letter-spacing="0.6">SESSIONS</text>

      <!-- Session 1 (.session-card.blocked) -->
      <g transform="translate(8 96)">
        <rect width="396" height="32" rx="6" fill="#1b1b20" stroke="#2e2e36"/>
        <path d="M0 6a6 6 0 0 1 2.5 -5v30a6 6 0 0 1 -2.5 -5z" fill="#cca700"/>
        <circle cx="14" cy="16" r="4" fill="#cca700">
          <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="20" fill="#f4f4f5" font-size="11.5" font-weight="600">Review PR feedback</text>
        <!-- .cache-pill + age -->
        <rect x="304" y="8" width="54" height="15" rx="4" fill="#e8825a" fill-opacity="0.14"/>
        <text x="331" y="18.5" text-anchor="middle" fill="#e8825a" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">⚡ 4:12</text>
        <text x="384" y="19.5" text-anchor="end" fill="#a1a1aa" font-size="10">4m</text>
        <!-- .cache-bar at bottom -->
        <rect x="3" y="30" width="310" height="2" rx="1" fill="url(#cacheGrad)" opacity="0.8"/>
      </g>

      <!-- Session 2 (.session-card.working) -->
      <g transform="translate(8 134)">
        <rect width="396" height="32" rx="6" fill="#1b1b20" stroke="#2e2e36"/>
        <path d="M0 6a6 6 0 0 1 2.5 -5v30a6 6 0 0 1 -2.5 -5z" fill="#3794ff"/>
        <!-- .status-orb.working (blue dot + spinning arc around exact center 14,16) -->
        <circle cx="14" cy="16" r="3.8" fill="#3794ff">
          <animate attributeName="opacity" values="1;0.45;1" dur="1.3s" repeatCount="indefinite"/>
        </circle>
        <path d="M14 9.5a6.5 6.5 0 1 1 -4.6 1.9" fill="none" stroke="#3794ff" stroke-width="1.4" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 14 16" to="360 14 16" dur="1.1s" repeatCount="indefinite"/>
        </path>
        <text x="26" y="20" fill="#f4f4f5" font-size="11.5" font-weight="600">Implement export endpoint</text>
        <text x="384" y="19.5" text-anchor="end" fill="#a1a1aa" font-size="10">1m</text>
      </g>
    </g>

    <!-- Section 3: Project Folder Card Auth Refactor (.card in inbox.js) -->
    <g transform="translate(58 358)">
      <rect width="412" height="76" rx="9" fill="url(#cardGrad)" stroke="#383842"/>
      <path d="M11 14.5l3.5 3.5 3.5-3.5" fill="none" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Folder icon (.ico.folder) -->
      <path d="M26 12h4.5l1.8 2h6.7a1.2 1.2 0 0 1 1.2 1.2v6.6a1.2 1.2 0 0 1-1.2 1.2H26a1.2 1.2 0 0 1-1.2-1.2V13.2A1.2 1.2 0 0 1 26 12z" fill="#e8825a" fill-opacity="0.18" stroke="#e8825a" stroke-width="1.3"/>
      <text x="46" y="20.5" fill="#f4f4f5" font-size="11.5" font-weight="700">Auth Refactor</text>
      <rect x="356" y="8" width="46" height="16" rx="8" fill="#18181b" stroke="#383842"/>
      <text x="379" y="19" text-anchor="middle" fill="#a1a1aa" font-size="9.5" font-weight="600">1 idle</text>

      <line x1="1" y1="32" x2="411" y2="32" stroke="#2e2e36"/>

      <!-- Session inside Auth Refactor -->
      <g transform="translate(8 38)">
        <rect width="396" height="32" rx="6" fill="#1b1b20" stroke="#2e2e36"/>
        <circle cx="14" cy="16" r="3.8" fill="#71717a"/>
        <text x="26" y="20" fill="#e4e4e7" font-size="11.5" font-weight="500">PKCE token rotation flow</text>
        <rect x="298" y="8" width="54" height="15" rx="4" fill="#e8825a" fill-opacity="0.14"/>
        <text x="325" y="18.5" text-anchor="middle" fill="#e8825a" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">⚡ 2:48</text>
        <text x="384" y="19.5" text-anchor="end" fill="#a1a1aa" font-size="10">12m</text>
        <rect x="3" y="30" width="210" height="2" rx="1" fill="url(#cacheGrad)" opacity="0.7"/>
      </g>
    </g>

    <!-- Section 4: UNGROUPED (.loose-list with standalone .session-card items) -->
    <g transform="translate(58 446)">
      <text x="4" y="11" fill="#8e8e98" font-size="9.5" font-weight="700" letter-spacing="0.8">UNGROUPED</text>
      <rect x="80" y="0" width="20" height="14" rx="7" fill="#e8825a" fill-opacity="0.14" stroke="#e8825a" stroke-opacity="0.38"/>
      <text x="90" y="10" text-anchor="middle" fill="#e8825a" font-size="9" font-weight="700">2</text>

      <!-- Standalone Session Card 1 (Working) -->
      <g transform="translate(0 18)">
        <rect width="412" height="32" rx="7" fill="#232329" stroke="#383842"/>
        <path d="M0 7a7 7 0 0 1 2.5 -5.5v29a7 7 0 0 1 -2.5 -5.5z" fill="#3794ff"/>
        <circle cx="14" cy="16" r="3.8" fill="#3794ff">
          <animate attributeName="opacity" values="1;0.45;1" dur="1.3s" repeatCount="indefinite"/>
        </circle>
        <path d="M14 9.5a6.5 6.5 0 1 1 -4.6 1.9" fill="none" stroke="#3794ff" stroke-width="1.4" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 14 16" to="360 14 16" dur="1.1s" repeatCount="indefinite"/>
        </path>
        <text x="26" y="20" fill="#f4f4f5" font-size="11.5" font-weight="600">Audit repository architecture</text>
        <text x="398" y="19.5" text-anchor="end" fill="#a1a1aa" font-size="10">1m</text>
      </g>

      <!-- Standalone Session Card 2 (Done) -->
      <g transform="translate(0 56)">
        <rect width="412" height="32" rx="7" fill="#232329" stroke="#383842" opacity="0.72"/>
        <circle cx="14" cy="16" r="3.8" fill="#89d185" opacity="0.6"/>
        <text x="26" y="20" fill="#a1a1aa" font-size="11.5">Bump vitest and tsconfig target</text>
        <text x="398" y="19.5" text-anchor="end" fill="#71717a" font-size="10">3h</text>
      </g>
    </g>

    <!-- Section 5: HISTORY toggle -->
    <g transform="translate(58 548)">
      <path d="M5 4l3.5 3.5L5 11" fill="none" stroke="#8e8e98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="15" y="11" fill="#8e8e98" font-size="9.5" font-weight="700" letter-spacing="0.8">HISTORY</text>
      <rect x="70" y="0" width="24" height="14" rx="7" fill="#e8825a" fill-opacity="0.14" stroke="#e8825a" stroke-opacity="0.38"/>
      <text x="82" y="10" text-anchor="middle" fill="#e8825a" font-size="9" font-weight="700">14</text>
    </g>

    <!-- VS Code Status Bar -->
    <rect y="590" width="480" height="22" fill="#141417"/>
    <rect x="48" y="591" width="164" height="20" fill="#ca8a04"/>
    <circle cx="60" cy="601" r="3.5" fill="#ffffff"/>
    <text x="70" y="605" fill="#ffffff" font-size="11" font-weight="600">Claude (1 waiting)</text>
    <text x="226" y="605" fill="#71717a" font-size="11">PROJ-142 · Review PR feedback</text>
  </g>
</svg>
