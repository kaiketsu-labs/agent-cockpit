<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <clipPath id="frame"><rect width="480" height="460" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="480" height="460" fill="#1e1e1e"/>

    <!-- Activity Bar -->
    <rect width="48" height="438" fill="#2c2c2c"/>
    <rect x="0" y="14" width="2" height="30" fill="#e8825a"/>
    <!-- Activity bar icon: Claude Deck cards -->
    <g transform="translate(14 19)" fill="none" stroke="#e8825a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="1" width="13" height="16.5" rx="2.5" opacity="0.45" transform="rotate(8 10.5 9.25)" />
      <rect x="0.5" y="3" width="13" height="16.5" rx="2.5" fill="#2c2c2c" />
      <path d="M4 8.5l3 2.5L4 13.5" />
      <line x1="8.5" y1="13.5" x2="10.5" y2="13.5" />
    </g>
    <!-- Other activity bar icons -->
    <g fill="#858585" opacity=".4">
      <rect x="15" y="68" width="18" height="18" rx="3"/>
      <rect x="15" y="104" width="18" height="18" rx="3"/>
      <rect x="15" y="140" width="18" height="18" rx="3"/>
    </g>

    <!-- Sidebar main area -->
    <rect x="48" width="432" height="438" fill="#252526"/>
    <text x="64" y="25" fill="#bbbbbb" font-size="11" letter-spacing=".6" font-weight="600">CLAUDE DECK</text>

    <!-- SESSIONS pane header -->
    <rect x="48" y="36" width="432" height="24" fill="#2a2a2b"/>
    <text x="58" y="52" fill="#cccccc" font-size="11" font-weight="700">▾  SESSIONS</text>
    <!-- Pane title action buttons (Codicons) -->
    <g transform="translate(340 40)" fill="none" stroke="#c5c5c5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- + (add) -->
      <path d="M6 2v10M1 7h10"/>
      <!-- comment-discussion -->
      <g transform="translate(18 0)">
        <path d="M1 2a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4L1 11V2z"/>
      </g>
      <!-- search -->
      <g transform="translate(36 0)">
        <circle cx="5" cy="5" r="3.5"/>
        <line x1="7.5" y1="7.5" x2="11" y2="11"/>
      </g>
      <!-- refresh -->
      <g transform="translate(54 0)">
        <path d="M10 5a4.5 4.5 0 1 1-1.2-3.1L10 3M10 0v3H7"/>
      </g>
      <!-- sort-precedence (A-Z) -->
      <g transform="translate(72 0)">
        <path d="M3 1v10M1 9l2 2 2-2M7 3h4l-4 5h4M8 11h2"/>
      </g>
    </g>

    <!-- Ticket 1: PROJ-142 -->
    <g transform="translate(0 68)">
      <rect x="48" y="0" width="432" height="22" fill="#37373d"/>
      <text x="58" y="16" fill="#c5c5c5">▾</text>
      <!-- play-circle (in-progress) -->
      <g transform="translate(76 4)" fill="none" stroke="#3794ff" stroke-width="1.4">
        <circle cx="7" cy="7" r="6"/>
        <polygon points="5.5,4.5 10,7 5.5,9.5" fill="#3794ff" stroke="none"/>
      </g>
      <text x="96" y="16" fill="#e7e7e7" font-weight="600">PROJ-142</text>
      <text x="164" y="16" fill="#9d9d9d">Add PDF export · 1 needs input · 1 working · 1 open PR</text>
    </g>

    <!-- PR: api#88 -->
    <g transform="translate(0 92)">
      <!-- git-pull-request icon (green) -->
      <g transform="translate(94 3)" fill="none" stroke="#89d185" stroke-width="1.4" stroke-linecap="round">
        <circle cx="3" cy="3" r="1.5" fill="#252526"/>
        <circle cx="3" cy="11" r="1.5" fill="#252526"/>
        <circle cx="9" cy="11" r="1.5" fill="#252526"/>
        <line x1="3" y1="4.5" x2="3" y2="9.5"/>
        <path d="M9 9.5V6a3 3 0 0 0-3-3H4.5"/>
      </g>
      <text x="114" y="15" fill="#cccccc">api#88</text>
      <text x="162" y="15" fill="#9d9d9d">feat(PROJ-142): PDF export endpoint</text>
    </g>

    <!-- Session 1: Review PR feedback (needs input / blocked) -->
    <g transform="translate(0 114)">
      <!-- bell-dot icon (yellow) -->
      <g transform="translate(94 2)" stroke="#cca700" stroke-width="1.3" fill="none" stroke-linejoin="round">
        <path d="M2.5 11h9l-1-2V5.5a3.5 3.5 0 1 0-7 0V9z"/>
        <circle cx="10.5" cy="3.5" r="1.8" fill="#cca700" stroke="none"/>
      </g>
      <text x="114" y="15" fill="#cccccc">Review PR feedback</text>
      <text x="252" y="15" fill="#9d9d9d">4m · cache 4:12</text>
    </g>

    <!-- Session 2: Implement export endpoint (working, live detail) -->
    <g transform="translate(0 136)">
      <!-- sync~spin icon (blue) -->
      <g transform="translate(94 3)" fill="none" stroke="#3794ff" stroke-width="1.4" stroke-linecap="round">
        <path d="M11 6a5 5 0 1 0 1 3"/>
        <polyline points="9,2 11.5,5.5 8,6.5" fill="#3794ff" stroke="none"/>
      </g>
      <text x="114" y="15" fill="#cccccc">Implement export endpoint</text>
      <text x="290" y="15" fill="#3794ff" opacity=".9">Bash: npm test</text>
    </g>

    <!-- Ticket 2: PROJ-157 -->
    <g transform="translate(0 164)">
      <text x="58" y="16" fill="#c5c5c5">▾</text>
      <!-- circle-large-outline icon (gray / to do) -->
      <circle cx="83" cy="11" r="5.5" fill="none" stroke="#858585" stroke-width="1.4"/>
      <text x="96" y="16" fill="#e7e7e7" font-weight="600">PROJ-157</text>
      <text x="164" y="16" fill="#9d9d9d">Fix login timeout · 1 idle</text>
    </g>

    <!-- Session 3: Investigate session expiry (idle) -->
    <g transform="translate(0 186)">
      <!-- debug-pause icon (gray) -->
      <g transform="translate(95 3)" fill="#858585">
        <rect x="1" y="2" width="3" height="10" rx="1"/>
        <rect x="7" y="2" width="3" height="10" rx="1"/>
      </g>
      <text x="114" y="15" fill="#cccccc">Investigate session expiry</text>
      <text x="286" y="15" fill="#9d9d9d">12m · cache 2:48</text>
    </g>

    <!-- Rule separator -->
    <g transform="translate(0 214)">
      <text x="64" y="10" fill="#3c3c3c" font-size="12" letter-spacing="-1">──────────────────────────────────────────────────────</text>
    </g>

    <!-- Session 4: Explore caching options (unticketed, working) -->
    <g transform="translate(0 230)">
      <g transform="translate(74 3)" fill="none" stroke="#3794ff" stroke-width="1.4" stroke-linecap="round">
        <path d="M11 6a5 5 0 1 0 1 3"/>
        <polyline points="9,2 11.5,5.5 8,6.5" fill="#3794ff" stroke="none"/>
      </g>
      <text x="94" y="15" fill="#cccccc">Explore caching options</text>
      <text x="254" y="15" fill="#3794ff" opacity=".9">Read cache.ts</text>
    </g>

    <!-- Session 5: Update dependencies (done) -->
    <g transform="translate(0 252)">
      <!-- check icon (disabledForeground) -->
      <path d="M76 9l3 3 6-7" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="94" y="15" fill="#777777">Update dependencies</text>
      <text x="236" y="15" fill="#555555">3h</text>
    </g>

    <!-- HISTORY pane header -->
    <rect x="48" y="286" width="432" height="22" fill="#2a2a2b"/>
    <text x="58" y="301" fill="#cccccc" font-size="11" font-weight="700">▸  HISTORY</text>
    <text x="134" y="301" fill="#888888" font-size="11">14 sessions</text>

    <!-- LEGEND pane header -->
    <rect x="48" y="310" width="432" height="22" fill="#2a2a2b"/>
    <text x="58" y="325" fill="#cccccc" font-size="11" font-weight="700">▸  LEGEND</text>

    <!-- VS Code Warning Notification Toast -->
    <g transform="translate(136 360)">
      <rect width="332" height="66" rx="5" fill="#252526" stroke="#454545" stroke-width="1"/>
      <!-- Warning triangle icon (yellow) -->
      <g transform="translate(14 14)" stroke="#cca700" stroke-width="1.4" fill="none" stroke-linejoin="round">
        <path d="M8 2l7 13H1L8 2z"/>
        <line x1="8" y1="6.5" x2="8" y2="10" stroke-linecap="round"/>
        <circle cx="8" cy="12.5" r=".7" fill="#cca700"/>
      </g>
      <text x="38" y="24" fill="#e7e7e7" font-size="12" font-weight="500">PROJ-142 Review PR feedback needs input</text>
      <rect x="258" y="36" width="60" height="20" rx="2" fill="#0e639c"/>
      <text x="274" y="50" fill="#ffffff" font-size="12" font-weight="500">Open</text>
    </g>

    <!-- Status Bar -->
    <rect y="438" width="480" height="22" fill="#181818" stroke="#2c2c2c" stroke-width="1"/>
    <!-- Left status item: Warning button -->
    <rect x="48" y="439" width="168" height="20" fill="#b89500"/>
    <g transform="translate(56 443)" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linejoin="round">
      <path d="M2.5 10h8l-1-2V5a3 3 0 1 0-6 0V8z"/>
      <circle cx="9.5" cy="3" r="1.5" fill="#ffffff" stroke="none"/>
    </g>
    <text x="74" y="453" fill="#ffffff" font-size="11" font-weight="600">Claude (1 waiting)</text>
    <!-- Normal status item beside it -->
    <text x="226" y="453" fill="#888888" font-size="11">UTF-8</text>
    <text x="270" y="453" fill="#888888" font-size="11">main</text>
  </g>
</svg>
